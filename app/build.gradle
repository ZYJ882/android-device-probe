plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deviceprobe.inspector'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.deviceprobe.inspector'
        minSdk 21
        targetSdk 35
        versionCode 21
        versionName '1.20.0'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def releaseStore = providers.gradleProperty('DEVICE_PROBE_RELEASE_STORE_FILE').orNull
            def releaseStorePassword = providers.gradleProperty('DEVICE_PROBE_RELEASE_STORE_PASSWORD').orNull
            def releaseKeyAlias = providers.gradleProperty('DEVICE_PROBE_RELEASE_KEY_ALIAS').orNull
            def releaseKeyPassword = providers.gradleProperty('DEVICE_PROBE_RELEASE_KEY_PASSWORD').orNull
            if (releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStore).exists()) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        enable 'NewApi', 'InlinedApi', 'ObsoleteLintCustomRule'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
